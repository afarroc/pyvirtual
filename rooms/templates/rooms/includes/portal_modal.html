<!-- ==========================================
     MODAL: Crear Portal - Management360
     ========================================== -->
<div class="modal-overlay" id="createPortal">
  <div class="modal">
    <div class="modal-header">
      <h5><i class="bi bi-door-open me-2"></i> Crear Portal</h5>
      <button type="button" class="close-btn" data-bs-dismiss="modal" aria-label="Close">&times;</button>
    </div>
    <form method="post" class="row g-3">
      {% csrf_token %}
      <div class="form-group">
        <label for="floatingPortalName">Nombre del Portal</label>
        {{ portal_form.name }}
      </div>
      <div class="form-group">
        <label for="floatingPortalDescription">Descripción</label>
        {{ portal_form.description }}
      </div>
      <div class="form-group">
        <label for="floatingEntrance">Entrada</label>
        {{ portal_form.entrance }}
      </div>
      <div class="form-group">
        <label for="floatingExit">Salida</label>
        {{ portal_form.exit }}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary" name="create_portal">
          <i class="bi bi-plus-circle"></i> Crear
        </button>
      </div>
    </form>
  </div>
</div>
