{% load static %}
<div class="modal-overlay" id="objectActionPanel" data-room-id="{{ room.pk }}">
  <div class="modal-dialog object-action-panel">
    <div class="modal-content">
      <div class="panel-header">
        <h3><i class="bi bi-plus-circle-fill me-2"></i>Crear celda en {{ room.name }}</h3>
        <button type="button" class="btn-close" data-close-panel aria-label="Close"></button>
      </div>

      <div class="panel-body">
        <div id="objectPanelState">
          <p class="text-muted mb-2">Cargando panel...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const panel = document.getElementById('objectActionPanel');
  if (!panel) return;

  const stateArea = panel.querySelector('#objectPanelState');
  const closeSelectors = '[data-close-panel], .btn-close';

  function closePanel() {
    panel.style.display = 'none';
    document.body.style.overflow = '';
    if (stateArea) stateArea.innerHTML = '<p class="text-muted mb-2">Cargando panel...</p>';
  }

  panel.addEventListener('click', function(e) {
    if (e.target.closest(closeSelectors) || e.target === panel) {
      closePanel();
    }
  });

  window.openObjectPanel = function() {
    if (!panel || !stateArea) return;
    panel.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    stateArea.innerHTML = '<p class="text-muted mb-2">Cargando panel...</p>';

    const roomId = panel.getAttribute('data-room-id');
    if (!roomId) return;

    fetch('{% url "rooms:object_action_panel" room_id=0 %}'.replace('/0/', '/' + roomId + '/'), {
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(function(r) { return r.text(); })
    .then(function(html) {
      stateArea.innerHTML = html;
      bindPanel(stateArea);
    })
    .catch(function() {
      stateArea.innerHTML = '<p class="text-danger">No se pudo cargar el panel de creación.</p>';
    });
  };

  window.closeObjectPanel = closePanel;

  function bindPanel(root) {
    const form = root.querySelector('#objectCreateForm');
    if (!form) return;

    const typeSelector = root.querySelector('#objectTypeSelector');
    const formArea = root.querySelector('#objectFormArea');
    const feedbackArea = root.querySelector('#objectFeedback');
    const backBtn = root.querySelector('#backToHotbar');
    const selectedTypeLabel = root.querySelector('#selectedTypeLabel');
    const slots = root.querySelectorAll('.hotbar-slot');

    const typeLabels = {
      WORK: 'Workstation',
      SOCIAL: 'Social Area',
      REST: 'Rest Zone',
      DOOR: 'Door',
      EQUIPMENT: 'Equipment',
      CONTAINER: 'Contenedor',
      ITEM: 'Item',
      FURNITURE: 'Mobiliario',
    };

    function showState(state) {
      if (typeSelector) typeSelector.style.display = state === 'select' ? 'block' : 'none';
      if (formArea) formArea.style.display = state === 'form' ? 'block' : 'none';
      if (feedbackArea) feedbackArea.style.display = state === 'feedback' ? 'block' : 'none';
    }

    function showFeedback(success, title, message, detail) {
      const icon = root.querySelector('#feedbackIcon');
      const titleEl = root.querySelector('#feedbackTitle');
      const messageEl = root.querySelector('#feedbackMessage');
      const detailEl = root.querySelector('#feedbackDetail');
      if (icon) icon.innerHTML = success
        ? '<i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>'
        : '<i class="bi bi-x-circle-fill text-danger" style="font-size: 3rem;"></i>';
      if (titleEl) titleEl.textContent = title;
      if (messageEl) messageEl.textContent = message;
      if (detailEl) {
        detailEl.innerHTML = '';
        if (detail) {
          detailEl.textContent = detail;
          detailEl.style.display = 'block';
        } else {
          detailEl.style.display = 'none';
        }
      }
      showState('feedback');
    }

    slots.forEach(function(slot) {
      slot.addEventListener('click', function() {
        const type = this.getAttribute('data-object-type');
        const typeInput = form.querySelector('#id_object_type');
        if (typeInput) typeInput.value = type;

        if (selectedTypeLabel) selectedTypeLabel.textContent = typeLabels[type] || type;
        updateFields(form, type);
        showState('form');

        slots.forEach(function(s) { s.classList.remove('active'); });
        this.classList.add('active');
      });
    });

    if (backBtn) {
      backBtn.addEventListener('click', function() {
        showState('select');
        slots.forEach(function(s) { s.classList.remove('active'); });
      });
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      button.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Creando...';

      const formData = new FormData(form);
      fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      })
      .then(function(response) { return response.json(); })
      .then(function(data) {
        if (data.success) {
          showFeedback(true, 'Celda creada', data.message || 'La celda se creó correctamente.');
          form.reset();
          slots.forEach(function(s) { s.classList.remove('active'); });
        } else {
          var detail = buildErrorDetail(data);
          showFeedback(false, data.message || 'No se pudo crear la celda.', detail);
        }
      })
      .catch(function() {
        showFeedback(false, 'Error', 'Error de conexión.');
      })
      .finally(function() {
        button.disabled = false;
        button.innerHTML = '<i class="bi bi-plus-circle me-1"></i> Crear celda';
      });
    });

    root.querySelector('#feedbackClose').addEventListener('click', closePanel);
    root.querySelector('#cancelObjectBtn').addEventListener('click', closePanel);
    showState('select');
  }

  function updateFields(form, type) {
    const roomFields = form.querySelector('.room-object-fields');
    const boxFields = form.querySelector('.box-fields');
    if (roomFields) roomFields.style.display = type === 'CONTAINER' ? 'none' : 'block';
    if (boxFields) boxFields.style.display = type === 'CONTAINER' ? 'block' : 'none';
  }

  function buildErrorDetail(data) {
    if (!data || data.success !== false) return '';
    var parts = [];
    if (data.message) parts.push(data.message);
    if (data.detail) parts.push(data.detail);
    if (data.errors) {
      try {
        var errorObj = typeof data.errors === 'string' ? JSON.parse(data.errors) : data.errors;
        var entries = Object.entries(errorObj);
        entries.forEach(function(entry) {
          var key = entry[0];
          var value = entry[1];
          var messages = [];
          if (Array.isArray(value)) {
            value.forEach(function(item) {
              if (item && item.msg) messages.push(item.msg);
              else messages.push(String(item));
            });
          } else {
            messages.push(String(value));
          }
          parts.push(key + ': ' + messages.join(', '));
        });
      } catch (e) {
        parts.push(String(data.errors));
      }
    }
    if (data.exception) parts.push('Exception: ' + data.exception);
    if (data.trace) parts.push('Trace: ' + data.trace);
    return parts.join('\n');
  }
})();
</script>
