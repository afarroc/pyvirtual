<!-- ==========================================
     MODAL: Crear Entrada/Salida - Management360
     ========================================== -->
<div class="modal-overlay" id="createEntranceExit">
  <div class="modal">
    <div class="modal-header">
      <h5><i class="bi bi-box-arrow-in-right me-2"></i> Crear Entrada/Salida</h5>
      <button type="button" class="close-btn" data-bs-dismiss="modal" aria-label="Close">&times;</button>
    </div>
    <form method="post" class="row g-3">
      {% csrf_token %}
      <div class="form-group">
        <label for="floatingName">Nombre</label>
        {{ entrance_exit_form.name }}
      </div>
      <div class="form-group">
        <label for="floatingTextarea">Descripción</label>
        {{ entrance_exit_form.description }}
      </div>
      <div class="form-group">
        <label for="floatingFace">Dirección (Cara)</label>
        {{ entrance_exit_form.face }}
      </div>
      <div class="form-group">
        <label for="floatingType">Tipo</label>
        {{ entrance_exit_form.type }}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary" name="create_entrance_exit">
          <i class="bi bi-plus-circle"></i> Crear
        </button>
      </div>
    </form>
  </div>
</div>
