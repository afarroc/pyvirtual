{% load static %}

{% if player %}
  <div class="section-card mb-3">
    <div class="section-header-success">
      <h5><i class="bi bi-person-fill me-2"></i> Estado del jugador</h5>
    </div>
    <div class="section-body">
      <div class="flex flex-col gap-2">
        <div class="flex justify-between">
          <span class="text-muted">Energía</span>
          <span class="font-semibold">{{ player.energy }}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-muted">Estado</span>
          <span class="badge bg-{% if player.state == 'AVAILABLE' %}success{% elif player.state == 'WORKING' %}primary{% elif player.state == 'RESTING' %}warning{% elif player.state == 'SOCIALIZING' %}info{% elif player.state == 'DISCONNECTED' %}secondary{% else %}secondary{% endif %}">{{ player.get_state_display }}</span>
        </div>
        {% if current_cell %}
          <div class="flex justify-between">
            <span class="text-muted">Ubicación</span>
            <span class="font-semibold">{{ current_cell.name }}</span>
          </div>
        {% endif %}
        <div class="flex justify-between">
          <span class="text-muted">Posición</span>
          <span class="font-semibold">({{ player.position_x }}, {{ player.position_y }})</span>
        </div>
      </div>
    </div>
  </div>
{% endif %}
