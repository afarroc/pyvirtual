<!-- ==========================================
   ALERTAS - Sistema de notificaciones del dashboard
   ========================================== -->
{% if messages %}
<div class="alerts-container" id="alertsContainer" role="alert">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible" role="alert">
        <div class="alert-content">
            <i class="fas 
                {% if message.tags == 'success' %}fa-check-circle
                {% elif message.tags == 'error' or message.tags == 'danger' %}fa-exclamation-triangle
                {% elif message.tags == 'warning' %}fa-exclamation-circle
                {% else %}fa-info-circle{% endif %}" 
                aria-hidden="true">
            </i>
            <span class="alert-message">{{ message }}</span>
        </div>
        <button type="button" class="alert-dismiss" data-dismiss="alert" aria-label="Close">
            <i class="fas fa-times" aria-hidden="true"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
