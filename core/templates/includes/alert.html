<!-- Sistema de Alertas Inteligente - Compatible con sistema centralizado -->
{% if messages %}
<div class="m360-alerts" id="legacyAlertsContainer">
    {% for message in messages %}
    <div class="m360-alert m360-alert-{{ message.tags|default:'info' }} m360-alert-dismissible m360-d-flex m360-items-center" role="alert">
        <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'error' or message.tags == 'danger' %}bi-exclamation-triangle-fill{% elif message.tags == 'warning' %}bi-exclamation-circle-fill{% else %}bi-info-circle-fill{% endif %}" style="font-size: var(--m360-text-lg);"></i>
        <div class="m360-flex-1">
            <div class="m360-alert-message">{{ message }}</div>
        </div>
        <button type="button" class="m360-alert-dismiss" data-m360-dismiss="alert" aria-label="Close">✕</button>
    </div>
    {% endfor %}
</div>
{% endif %}
