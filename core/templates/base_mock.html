<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    {% include 'includes/header.html' %}

    <div class="app-container">
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        {% include 'includes/sidebar.html' %}

        <main id="main" class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% include 'includes/footer.html' %}

    <style>
        :root {
            --color-primary: #2563eb;
            --color-primary-light: #eff6ff;
            --color-text: #111827;
            --color-text-secondary: #374151;
            --color-text-muted: #6b7280;
            --color-background: #f9fafb;
            --color-white: #ffffff;
            --color-border: #e5e7eb;
            --color-hover: #f3f4f6;
            --color-danger: #ef4444;
            --sidebar-width: 280px;
            --sidebar-collapsed-width: 64px;
            --header-height: 64px;
            --transition-speed: 0.3s;
            --transition-ease: cubic-bezier(0.4, 0, 0.2, 1);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 0.75rem;
            --spacing-lg: 1rem;
            --spacing-xl: 1.5rem;
            --spacing-2xl: 2rem;
            --header-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            --header-radius: 12px;
            --header-radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-family); background: var(--color-background); color: var(--color-text); display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }
        button { background: none; border: none; cursor: pointer; font-family: inherit; }
        ul { list-style: none; }
        .header { background: var(--color-white); border-bottom: 1px solid var(--color-border); padding: 0.5rem 1.5rem; position: sticky; top: 0; z-index: 1000; height: var(--header-height); display: flex; align-items: center; font-family: var(--font-family); }
        .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; width: 100%; }
        .header-brand { display: flex; align-items: center; gap: 1rem; }
        .header-toggle { display: none; font-size: 1.25rem; color: var(--color-text-secondary); padding: 0.5rem; border-radius: var(--header-radius-sm); background: none; border: none; cursor: pointer; transition: background var(--transition-speed) var(--transition-ease); }
        .header-toggle:hover { background: var(--color-hover); }
        .header-logo { font-size: 1.1rem; font-weight: 700; color: var(--color-text); display: flex; align-items: center; gap: 0.5rem; text-decoration: none; transition: color var(--transition-speed) var(--transition-ease); }
        .header-logo:hover { color: var(--color-primary); }
        .header-brand-mark { background: var(--color-primary); color: #ffffff; padding: 0.2rem 0.5rem; border-radius: var(--header-radius-sm); font-size: 0.7rem; font-weight: 700; }
        .header-nav { display: flex; align-items: center; }
        .header-nav-list { display: flex; align-items: center; gap: 0.25rem; margin: 0; padding: 0; list-style: none; }
        .nav-item { position: relative; }
        .nav-link { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; color: var(--color-text-secondary); font-size: 0.875rem; border-radius: var(--header-radius-sm); background: none; border: none; cursor: pointer; position: relative; font-family: inherit; transition: all var(--transition-speed) var(--transition-ease); text-decoration: none; }
        .nav-link:hover { background: var(--color-hover); color: var(--color-text); }
        .nav-link i { font-size: 1.1rem; }
        .nav-link.active { background: var(--color-primary-light); color: var(--color-primary); }
        .nav-link .chevron { font-size: 0.6rem; transition: transform var(--transition-speed) var(--transition-ease); color: var(--color-text-muted); }
        .nav-link[aria-expanded="true"] .chevron { transform: rotate(180deg); }
        .badge { position: absolute; top: 2px; right: 2px; background: var(--color-danger); color: #ffffff; font-size: 0.6rem; font-weight: 700; padding: 0.1rem 0.4rem; border-radius: 50%; min-width: 18px; height: 18px; display: none; align-items: center; justify-content: center; line-height: 1; }
        .profile-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--color-primary-light); color: var(--color-primary); font-weight: 600; font-size: 0.875rem; }
        .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .profile-name { display: none; }
        .dropdown-menu { position: absolute; top: calc(100% + 0.5rem); right: 0; min-width: 280px; background: #ffffff; border-radius: var(--header-radius); box-shadow: var(--header-shadow); padding: 0.5rem 0; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all var(--transition-speed) var(--transition-ease); z-index: 1050; border: 1px solid var(--color-border); list-style: none; margin: 0; }
        .dropdown-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-menu.notifications { min-width: 360px; }
        .dropdown-menu.profile { min-width: 240px; }
        .dropdown-menu::before { content: ''; position: absolute; top: -8px; right: 20px; width: 14px; height: 14px; background: #ffffff; border-left: 1px solid var(--color-border); border-top: 1px solid var(--color-border); transform: rotate(45deg); border-radius: 3px 0 0 0; }
        .dropdown-header { padding: 0.75rem 1rem; font-weight: 600; font-size: 0.75rem; color: var(--color-text-muted); border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; }
        .dropdown-header h6 { font-size: 0.875rem; font-weight: 600; color: var(--color-text); margin: 0; }
        .dropdown-header span { color: var(--color-text-muted); font-weight: 400; }
        .btn-mark-read { font-size: 0.75rem; color: var(--color-primary); padding: 0.25rem 0.75rem; border-radius: var(--header-radius-sm); background: none; border: none; cursor: pointer; transition: all var(--transition-speed) var(--transition-ease); }
        .btn-mark-read:hover { background: var(--color-primary-light); }
        .dropdown-divider { border: none; border-top: 1px solid var(--color-border); margin: 0.25rem 0; }
        .dropdown-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1rem; color: var(--color-text-secondary); font-size: 0.875rem; transition: all var(--transition-speed) var(--transition-ease); cursor: pointer; border: none; background: none; width: 100%; text-align: left; text-decoration: none; font-family: inherit; }
        .dropdown-item:hover { background: var(--color-hover); color: var(--color-text); }
        .dropdown-item i { width: 1.25rem; text-align: center; color: var(--color-text-muted); font-size: 1rem; }
        .dropdown-item:hover i { color: var(--color-primary); }
        .dropdown-footer { padding: 0.6rem 1rem; border-top: 1px solid var(--color-border); text-align: center; }
        .dropdown-footer a { color: var(--color-primary); font-size: 0.8125rem; font-weight: 500; text-decoration: none; }
        .dropdown-footer a:hover { text-decoration: underline; }
        .notification-item { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.6rem 1rem; border-bottom: 1px solid var(--color-border); transition: background var(--transition-speed) var(--transition-ease); cursor: pointer; }
        .notification-item:hover { background: var(--color-hover); }
        .notification-item:last-child { border-bottom: none; }
        .notification-item i { margin-top: 2px; color: var(--color-primary); font-size: 1rem; width: 1.25rem; text-align: center; }
        .notification-item .content { flex: 1; }
        .notification-item strong { display: block; font-size: 0.875rem; color: var(--color-text); }
        .notification-item p { margin: 2px 0; font-size: 0.8125rem; color: var(--color-text-secondary); }
        .notification-item .time { font-size: 0.7rem; color: var(--color-text-muted); }
        .empty-state { text-align: center; padding: 2rem 1rem; color: var(--color-text-muted); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 0.5rem; display: block; opacity: 0.5; }
        .empty-state p { margin: 0; font-size: 0.875rem; }
        .app-container { display: flex; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; position: relative; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 998; }
        .sidebar-overlay.active { display: block; }
        .sidebar { width: var(--sidebar-width); background: var(--color-white); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; position: sticky; top: 0; overflow-y: auto; padding: 1rem 0; transition: transform var(--transition-speed) var(--transition-ease), width var(--transition-speed) var(--transition-ease); flex-shrink: 0; z-index: 999; height: calc(100vh - var(--header-height)); }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        .sidebar.collapsed { width: var(--sidebar-collapsed-width); }
        .sidebar.collapsed .sidebar-title, .sidebar.collapsed .sidebar-divider, .sidebar.collapsed .sidebar-nav-link span:not(.dropdown-icon) { display: none; }
        .sidebar.collapsed .sidebar-nav-link { justify-content: center; padding: 0.5rem; }
        .sidebar.collapsed .sidebar-dropdown { display: none; }
        .skip-link { position: absolute; top: -100%; left: 50%; transform: translateX(-50%); background: #1f2937; color: #ffffff; padding: 0.5rem 1rem; z-index: 100; border-radius: 0.25rem; }
        .skip-link:focus { top: 1rem; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 0 1.25rem 1rem; border-bottom: 1px solid var(--color-border); }
        .sidebar.collapsed .sidebar-header { padding: 0 0.75rem 1rem; justify-content: center; }
        .sidebar-title { font-weight: 600; font-size: 0.75rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 0.5rem; }
        .sidebar-toggle { color: var(--color-text-muted); padding: 0.25rem; display: flex; align-items: center; justify-content: center; border-radius: 0.375rem; transition: background 0.2s; font-size: 1.25rem; }
        .sidebar-toggle:hover { background: var(--color-hover); }
        .sidebar-nav { padding: 0.5rem 0.75rem; flex: 1; }
        .sidebar-nav-item { display: block; margin-bottom: 0.125rem; padding-left: 1rem; }
        .sidebar-nav-link { display: flex; align-items: center; padding: 0.5rem 0.75rem; color: var(--color-text-secondary); border-radius: 0.375rem; transition: background 0.15s, color 0.15s; width: 100%; font-size: 0.875rem; text-align: left; gap: 0.75rem; background: none; border: none; cursor: pointer; font-family: inherit; text-decoration: none; }
        .sidebar-nav-link i { width: 1.25rem; text-align: center; }
        .sidebar-nav-link:hover { background: var(--color-hover); color: var(--color-text); }
        .sidebar-nav-link.active { background: var(--color-primary-light); color: var(--color-primary); }
        .sidebar-nav-link .dropdown-icon { margin-left: auto; transition: transform var(--transition-speed); font-size: 0.625rem; color: var(--color-text-muted); }
        .sidebar-nav-link .dropdown-icon.open { display: none; }
        .sidebar-dropdown { padding-left: 1.5rem; display: none; }
        .sidebar-dropdown .sidebar-nav-link { padding-left: 1.25rem; font-size: 0.8125rem; }
        .sidebar-divider { font-size: 0.75rem; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0.75rem 0.75rem 0.5rem; margin-top: 0.5rem; border-top: 1px solid var(--color-border); display: flex; align-items: center; gap: 0.5rem; }
        .sidebar-divider:first-of-type { border-top: none; margin-top: 0; }
        .main-content { flex: 1; padding: 2rem; min-height: calc(100vh - var(--header-height) - 80px); transition: margin-left var(--transition-speed) var(--transition-ease); }
        .footer { background: var(--color-white); border-top: 1px solid var(--color-border); padding: 1.5rem; margin-top: auto; }
        .footer-container { max-width: 1400px; margin: 0 auto; width: 100%; }
        .footer-content { display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; color: var(--color-text-muted); }
        .footer-links { display: flex; gap: 1.5rem; }
        .footer-links a { color: var(--color-text-muted); display: flex; align-items: center; gap: 0.5rem; transition: color 0.15s; }
        .footer-links a:hover { color: var(--color-primary); }
        @media (min-width: 769px) { .profile-name { display: inline; } }
        @media (max-width: 768px) {
            .header { height: auto; min-height: var(--header-height); padding: 0.5rem 1rem; }
            .header-container { flex-wrap: wrap; gap: 0.5rem; }
            .header-toggle { display: block; }
            .header-nav { order: 3; width: 100%; overflow-x: auto; padding: 0.25rem 0; }
            .header-nav-list { justify-content: center; flex-wrap: nowrap; gap: 0.25rem; min-width: max-content; }
            .nav-link { padding: 0.4rem 0.6rem; font-size: 0.8125rem; white-space: nowrap; }
            .profile-name { display: none; }
            .dropdown-menu { position: fixed; bottom: 0; top: auto; left: 0; right: 0; width: 100%; min-width: unset; max-height: 60vh; border-radius: var(--header-radius) var(--header-radius) 0 0; transform: translateY(100%); opacity: 1; visibility: visible; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.15); border: none; padding-bottom: env(safe-area-inset-bottom); transition: transform 0.35s var(--transition-ease); }
            .dropdown-menu.show { transform: translateY(0); }
            .dropdown-menu::before { display: none; }
            .dropdown-menu::after { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; background: var(--color-border); border-radius: 2px; }
            .dropdown-menu.notifications { min-width: unset; }
            .dropdown-menu.profile { min-width: unset; }
            .sidebar { position: fixed; top: 0; left: 0; height: 100vh; transform: translateX(-100%); width: var(--sidebar-width); border-right: 1px solid var(--color-border); box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1); transition: transform var(--transition-speed) var(--transition-ease), width var(--transition-speed) var(--transition-ease); z-index: 999; padding-top: var(--header-height); }
            .sidebar.open { transform: translateX(0); }
            .sidebar.collapsed { width: var(--sidebar-width); transform: translateX(-100%); }
            .sidebar.collapsed.open { transform: translateX(0); }
            .sidebar.collapsed .sidebar-title, .sidebar.collapsed .sidebar-divider, .sidebar.collapsed .sidebar-nav-link span:not(.dropdown-icon) { display: block; }
            .sidebar.collapsed .sidebar-nav-link { justify-content: flex-start; padding: 0.5rem 0.75rem; }
            .sidebar.collapsed .sidebar-dropdown { display: none; }
            .sidebar-overlay.active { display: block; }
            .main-content { padding: 1rem; }
            .footer-content { flex-direction: column; gap: 0.5rem; text-align: center; }
            .footer-links { flex-wrap: wrap; justify-content: center; }
        }
    </style>

    <script>
        (function() {
            'use strict';
            var CONFIG = {
                breakpoints: { mobile: 768 },
                selectors: { header: '#mainHeader', sidebar: '#mainSidebar', sidebarToggle: '#sidebarToggle', headerToggle: '#headerToggle', overlay: '#sidebarOverlay', dropdownToggle: '.dropdown-toggle', navLink: '.sidebar-nav-link[href]' },
                classes: { sidebarOpen: 'open', sidebarCollapsed: 'collapsed', overlayActive: 'active', dropdownOpen: 'open', show: 'show' }
            };
            var Utils = {
                getElement: function(s) { var e = document.querySelector(s); if (!e) console.warn('Elemento no encontrado: ' + s); return e; },
                getHeight: function(e) { return e ? e.offsetHeight : 0; },
                isMobile: function() { return window.innerWidth <= CONFIG.breakpoints.mobile; },
                debounce: function(func, wait) { var timeout; return function() { var args = arguments, ctx = this; clearTimeout(timeout); timeout = setTimeout(function() { func.apply(ctx, args); }, wait); }; }
            };
            var HeaderDropdownModule = {
                init: function() {
                    var toggles = document.querySelectorAll('.nav-item.dropdown > .dropdown-toggle');
                    toggles.forEach(function(toggle) {
                        toggle.addEventListener('click', function(e) {
                            e.preventDefault(); e.stopPropagation();
                            var menu = this.closest('.dropdown').querySelector('.dropdown-menu');
                            var isOpen = menu.classList.contains(CONFIG.classes.show);
                            document.querySelectorAll('.dropdown-menu.show').forEach(function(m) { m.classList.remove(CONFIG.classes.show); var btn = m.closest('.dropdown').querySelector('.dropdown-toggle'); if (btn) btn.setAttribute('aria-expanded', 'false'); });
                            if (!isOpen) { menu.classList.add(CONFIG.classes.show); this.setAttribute('aria-expanded', 'true'); }
                        });
                    });
                    document.addEventListener('click', function(e) { if (!e.target.closest('.dropdown')) { document.querySelectorAll('.dropdown-menu.show').forEach(function(menu) { menu.classList.remove(CONFIG.classes.show); var toggle = menu.closest('.dropdown').querySelector('.dropdown-toggle'); if (toggle) toggle.setAttribute('aria-expanded', 'false'); }); } });
                    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { document.querySelectorAll('.dropdown-menu.show').forEach(function(menu) { menu.classList.remove(CONFIG.classes.show); var toggle = menu.closest('.dropdown').querySelector('.dropdown-toggle'); if (toggle) toggle.setAttribute('aria-expanded', 'false'); }); } });
                }
            };
            var HeaderNotificationsModule = {
                init: function() {
                    var badge = document.getElementById('notificationBadge'), markBtn = document.getElementById('markAllRead'), list = document.getElementById('notificationsList');
                    if (markBtn) { markBtn.addEventListener('click', function() { if (badge) badge.style.display = 'none'; if (list) { list.innerHTML = '<div class="empty-state"><i class="fas fa-check-circle"></i><p>Todas las notificaciones leidas</p></div>'; } this.style.display = 'none'; }); }
                }
            };
            var SidebarModule = {
                elements: {},
                init: function() { this.elements = { sidebar: Utils.getElement(CONFIG.selectors.sidebar), header: Utils.getElement(CONFIG.selectors.header), sidebarToggle: Utils.getElement(CONFIG.selectors.sidebarToggle), headerToggle: Utils.getElement(CONFIG.selectors.headerToggle), overlay: Utils.getElement(CONFIG.selectors.overlay) }; if (!this.elements.sidebar) return; this.updateHeight(); this.bindEvents(); },
                updateHeight: function() { var sidebar = this.elements.sidebar, header = this.elements.header; if (!sidebar || !header) return; var headerHeight = Utils.getHeight(header); document.documentElement.style.setProperty('--header-height', headerHeight + 'px'); if (Utils.isMobile()) { sidebar.style.paddingTop = headerHeight + 'px'; } else { sidebar.style.height = 'calc(100vh - ' + headerHeight + 'px)'; sidebar.style.top = headerHeight + 'px'; sidebar.style.paddingTop = '1rem'; } },
                toggleDesktop: function() { if (Utils.isMobile()) return; var sidebar = this.elements.sidebar, sidebarToggle = this.elements.sidebarToggle; if (!sidebar) return; sidebar.classList.toggle(CONFIG.classes.sidebarCollapsed); var isCollapsed = sidebar.classList.contains(CONFIG.classes.sidebarCollapsed); if (sidebarToggle) { var icon = sidebarToggle.querySelector('i'); if (icon) icon.className = isCollapsed ? 'fas fa-chevron-right' : 'fas fa-chevron-left'; sidebarToggle.setAttribute('aria-label', isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'); } },
                toggleMobile: function() { if (!Utils.isMobile()) return; var sidebar = this.elements.sidebar, overlay = this.elements.overlay, header = this.elements.header; if (!sidebar) return; sidebar.classList.toggle(CONFIG.classes.sidebarOpen); overlay.classList.toggle(CONFIG.classes.overlayActive); if (sidebar.classList.contains(CONFIG.classes.sidebarOpen)) { sidebar.style.paddingTop = Utils.getHeight(header) + 'px'; document.querySelectorAll('.dropdown-menu.show').forEach(function(menu) { menu.classList.remove(CONFIG.classes.show); var toggle = menu.closest('.dropdown').querySelector('.dropdown-toggle'); if (toggle) toggle.setAttribute('aria-expanded', 'false'); }); } },
                closeMobile: function() { var sidebar = this.elements.sidebar, overlay = this.elements.overlay; if (sidebar) sidebar.classList.remove(CONFIG.classes.sidebarOpen); if (overlay) overlay.classList.remove(CONFIG.classes.overlayActive); },
                bindEvents: function() { var sidebarToggle = this.elements.sidebarToggle, headerToggle = this.elements.headerToggle, overlay = this.elements.overlay; if (sidebarToggle) sidebarToggle.addEventListener('click', function(e) { e.stopPropagation(); if (Utils.isMobile()) SidebarModule.closeMobile(); else SidebarModule.toggleDesktop(); }); if (headerToggle) headerToggle.addEventListener('click', function(e) { e.stopPropagation(); if (Utils.isMobile()) SidebarModule.toggleMobile(); else SidebarModule.toggleDesktop(); }); if (overlay) overlay.addEventListener('click', function() { SidebarModule.closeMobile(); }); var debouncedResize = Utils.debounce(function() { SidebarModule.updateHeight(); if (Utils.isMobile()) SidebarModule.closeMobile(); }, 100); window.addEventListener('resize', debouncedResize); var header = this.elements.header; if (header) { var observer = new MutationObserver(function() { SidebarModule.updateHeight(); }); observer.observe(header, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] }); } }
            };
            var DropdownModule = {
                init: function() { var toggles = document.querySelectorAll(CONFIG.selectors.dropdownToggle); toggles.forEach(function(toggle) { toggle.addEventListener('click', DropdownModule.handleToggle); }); },
                handleToggle: function(event) { event.stopPropagation(); var button = event.currentTarget, parent = button.closest('.has-dropdown'); if (!parent) return; var dropdown = parent.querySelector('.sidebar-dropdown'), icon = button.querySelector('.dropdown-icon'), isOpen = dropdown.style.display === 'block'; if (isOpen) { dropdown.style.display = 'none'; button.setAttribute('aria-expanded', 'false'); if (icon) icon.classList.remove(CONFIG.classes.dropdownOpen); } else { dropdown.style.display = 'block'; button.setAttribute('aria-expanded', 'true'); if (icon) icon.classList.add(CONFIG.classes.dropdownOpen); } }
            };
            var NavigationModule = {
                init: function() { var currentPath = window.location.pathname, links = document.querySelectorAll(CONFIG.selectors.navLink); links.forEach(function(link) { if (link.getAttribute('href') === currentPath) NavigationModule.activateLink(link); }); },
                activateLink: function(link) { link.classList.add('active'); var parent = link.closest('.sidebar-dropdown'); while (parent) { var parentDropdown = parent.closest('.has-dropdown'); if (parentDropdown) { var toggle = parentDropdown.querySelector(CONFIG.selectors.dropdownToggle), dropdown = parentDropdown.querySelector('.sidebar-dropdown'), icon = toggle ? toggle.querySelector('.dropdown-icon') : null; if (dropdown) dropdown.style.display = 'block'; if (toggle) toggle.setAttribute('aria-expanded', 'true'); if (icon) icon.classList.add(CONFIG.classes.dropdownOpen); } parent = parent.parentElement.closest('.sidebar-dropdown'); } }
            };
            var HeaderActiveModule = { init: function() { var currentPath = window.location.pathname; document.querySelectorAll('.header-nav .nav-link[href]').forEach(function(link) { if (link.getAttribute('href') === currentPath) link.classList.add('active'); }); } };
            document.addEventListener('DOMContentLoaded', function() { HeaderDropdownModule.init(); HeaderNotificationsModule.init(); SidebarModule.init(); DropdownModule.init(); NavigationModule.init(); HeaderActiveModule.init(); if (Utils.isMobile()) { var sidebar = document.querySelector(CONFIG.selectors.sidebar), overlay = document.querySelector(CONFIG.selectors.overlay); if (sidebar) sidebar.classList.remove(CONFIG.classes.sidebarOpen); if (overlay) overlay.classList.remove(CONFIG.classes.overlayActive); } });
        })();
    </script>
</body>
</html>
