<div class="kpi-field">
    <label class="kpi-field-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
        <small class="kpi-field-help">{{ field.help_text }}</small>
    {% endif %}
    {% for error in field.errors %}
        <div class="kpi-field-error">{{ error }}</div>
    {% endfor %}
</div>
