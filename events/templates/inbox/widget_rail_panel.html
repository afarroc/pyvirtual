{% load static %}
<div
    data-widget-rail-panel="inbox"
    class="m360-widget-rail-panel"
    aria-hidden="true"
    aria-label="Inbox GTD"
>
    <div class="m360-widget-rail-panel-header">
        <span class="m360-widget-rail-panel-title">Inbox GTD</span>
            <button class="m360-widget-rail-panel-close" type="button" aria-label="Close inbox">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
    </div>
    <div class="m360-widget-rail-panel-body">
        <form id="inboxQuickForm" autocomplete="off">
            <div class="mb-3">
                <label for="inboxQuickTitle" class="form-label">Título *</label>
                <input type="text" id="inboxQuickTitle" name="title" class="form-control" placeholder="¿Qué necesitas capturar?" required>
            </div>
            <div class="mb-3">
                <label for="inboxQuickDescription" class="form-label">Descripción</label>
                <textarea id="inboxQuickDescription" name="description" class="form-control" placeholder="Detalles..." rows="3"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-fill">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    Capturar
                </button>
                <button type="button" class="btn btn-secondary" onclick="window.open('/events/inbox/', '_blank')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                    Ver Todo
                </button>
            </div>
        </form>
        <div class="mt-3">
            <div class="d-flex justify-content-between">
                <span class="text-muted">Pendientes</span>
                <span id="inboxStatUnprocessed" class="fw-semibold">0</span>
            </div>
        </div>
    </div>
</div>
<script>
    (function() {
        'use strict';
        if (window.__inboxRailWidgetInitialized) return;
        window.__inboxRailWidgetInitialized = true;

        function initInboxRail() {
            try {
                const WidgetRailCtor = window.WidgetRail;
                const rail = window.widgetRailInstance = window.widgetRailInstance || new WidgetRailCtor();
                const inboxButton = document.querySelector('[data-widget-rail-item="inbox"]');
                const closeBtn = document.querySelector('[data-widget-rail-panel="inbox"] .m360-widget-rail-panel-close');
                const form = document.getElementById('inboxQuickForm');
                const titleInput = document.getElementById('inboxQuickTitle');
                const descInput = document.getElementById('inboxQuickDescription');
                const unreadBadge = document.querySelector('[data-widget-rail-badge="inbox"]');
                const unreadCountEl = document.getElementById('inboxStatUnprocessed');

                function getCsrfToken() {
                    const formEl = document.getElementById('csrf-form');
                    if (!formEl) return '';
                    const input = formEl.querySelector('[name=csrfmiddlewaretoken]');
                    return input ? input.value : '';
                }

                async function updateBadge() {
                    try {
                        const response = await fetch('/events/inbox/api/stats/', {
                            method: 'GET',
                            headers: { 'X-Requested-With': 'XMLHttpRequest' }
                        });
                        if (!response.ok) return;
                        const data = await response.json();
                        if (!data.success) return;
                        const count = data.stats.unprocessed || 0;
                        if (unreadBadge) {
                            unreadBadge.textContent = String(count);
                            unreadBadge.style.display = count > 0 ? 'inline-flex' : 'none';
                        }
                        if (unreadCountEl) {
                            unreadCountEl.textContent = String(count);
                        }
                        if (rail) {
                            rail.setBadge('inbox', count);
                        }
                    } catch (e) {
                        console.error('Rail inbox: stats failed', e);
                    }
                }

                async function createItem(title, description) {
                    const formData = new FormData();
                    formData.append('title', title);
                    formData.append('description', description);
                    formData.append('csrfmiddlewaretoken', getCsrfToken());

                    const response = await fetch('/events/inbox/', {
                        method: 'POST',
                        body: formData,
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });

                    if (response.headers.get('X-Requested-With') === 'XMLHttpRequest') {
                        return await response.json();
                    }
                    window.location.reload();
                    return { success: true };
                }

                async function onSubmit(e) {
                    e.preventDefault();
                    const title = titleInput.value.trim();
                    const description = descInput.value.trim();
                    if (!title) return;

                    const result = await createItem(title, description);
                    if (result.success) {
                        titleInput.value = '';
                        descInput.value = '';
                        await updateBadge();
                    }
                }

                if (rail) {
                    rail.register({
                        id: 'inbox',
                        label: 'Inbox GTD',
                        icon: 'bi-lightning-charge-fill',
                        onOpen: updateBadge,
                        onClose() {}
                    });

                    if (inboxButton) {
                        inboxButton.addEventListener('click', () => rail.toggle('inbox'));
                    } else {
                        console.warn('Rail inbox: button not found');
                    }

                    if (closeBtn) {
                        closeBtn.addEventListener('click', () => rail.toggle('inbox'));
                    }

                    form.addEventListener('submit', onSubmit);
                    updateBadge();
                    rail.restoreState();
                } else {
                    console.warn('Rail inbox: WidgetRail not available');
                }
            } catch (e) {
                console.error('Rail inbox: init failed', e);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initInboxRail);
        } else {
            initInboxRail();
        }
    })();
</script>
