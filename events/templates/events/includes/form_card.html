<!-- Customers Card -->
<div class="events-col-12">
    <div class="m360-card">
        <div class="m360-card-header">
            <h5 class="m360-card-title events-mb-0">{{ event.title }} <span>| {{ title }}</span></h5>
        </div>
        <div class="m360-card-body">
            <div class="events-d-flex events-align-center events-gap-2">
                <div class="events-avatar-sm">
                    <div class="events-avatar-title">
                        <i class="bi bi-calendar2-plus-fill"></i>
                    </div>
                </div>
                <div>
                    <h6 class="events-mb-1">{{ event.id }}</h6>
                    <span class="events-text-danger" style="font-size: var(--m360-text-sm);">{{ event.created_at|date:"d-M H:i" }}</span>
                    <span class="events-text-muted" style="font-size: var(--m360-text-sm);">created at</span>
                </div>
            </div>
        </div>
        <div class="m360-card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="m360-btn m360-btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
