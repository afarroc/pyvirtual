<!-- events/includes/messages.html -->
{% if messages %}
<div class="messages">
    {% for message in messages %}
    <div class="m360-alert m360-alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% else %}{{ message.tags }}{% endif %}" style="position: relative;">
        <div class="events-d-flex events-align-center events-gap-2">
            <div class="events-flex-grow">
                {% if message.extra_tags %}
                <strong class="events-block" style="font-size: var(--m360-text-sm);">{{ message.extra_tags }}</strong>
                {% endif %}
                {{ message|safe }}
            </div>
            <button type="button" class="m360-close-modal" data-m360-close aria-label="Close" style="flex-shrink: 0;">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        {% if message.tags == 'success' or message.tags == 'info' %}
        <div class="m360-progress" style="position: absolute; bottom: 0; left: 0; height: 3px;">
            <div class="m360-progress-fill" style="width: 100%; animation: events-progress 5s linear forwards;"></div>
        </div>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% endif %}
